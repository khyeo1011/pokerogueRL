name: Bridge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pokerogue and its assets/locales submodules: the test harness loads game data from assets/.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pokerogue deps
        working-directory: pokerogue
        run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile

      - run: scripts/test_bridge.sh --silent=passed-only
