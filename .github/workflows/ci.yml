name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the stub bridge doesn't import pokerogue yet.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # setup-uv publishes no floating major tags past v7; pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"

      # uv sync would install the locked CUDA torch (several GB); CI only needs CPU wheels.
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group dev --torch-backend cpu

      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest
